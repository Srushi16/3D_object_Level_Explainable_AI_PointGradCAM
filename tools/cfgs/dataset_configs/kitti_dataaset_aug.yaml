DATASET: 'KittiZipDataset'
DATA_PATH: /dataset/original
INFO_DIR: /netscratch/rsonawane/ex_ai/OpenPCDet/KITTI


# Reasonable range for KITTI (forward-facing LiDAR)
POINT_CLOUD_RANGE: [0, -40, -3, 70.4, 40, 1]

DATA_SPLIT:
    train: train
    test: val

INFO_PATH:
    train: ['kitti_infos_train.pkl']
    test: ['kitti_infos_val.pkl']

GET_ITEM_LIST: ['points']

# Keep all points for LIME flexibility (FOV filtering applied in DATA_PROCESSOR)
FOV_POINTS_ONLY: False

DATA_AUGMENTOR:
  DISABLE_AUG_LIST: ['placeholder']
  AUG_CONFIG_LIST:
    - NAME: gt_sampling
      USE_ROAD_PLANE: False
      DB_INFO_PATH:
        - 'kitti_dbinfos_train.pkl'
      PREPARE:
        filter_by_min_points: ['Car:5', 'Pedestrian:5', 'Cyclist:5']
        filter_by_difficulty: [-1]
      SAMPLE_GROUPS: ['Car:15', 'Pedestrian:20', 'Cyclist:20']
      NUM_POINT_FEATURES: 4
      DATABASE_WITH_FAKELIDAR: False
      REMOVE_EXTRA_WIDTH: [0.0, 0.0, 0.0]
      LIMIT_WHOLE_SCENE: True
    - NAME: random_world_flip
      ALONG_AXIS_LIST: ['x']
    - NAME: random_world_rotation
      WORLD_ROT_ANGLE: [-0.39269908, 0.39269908]
    - NAME: random_world_scaling
      WORLD_SCALE_RANGE: [0.98, 1.02]
    - NAME: random_world_translation
      WORLD_TRANSLATE_RANGE: [0.0, 0.0, 0.0]
    - NAME: random_world_shear
      WORLD_SHEAR_RANGE: [0.0, 0.0, 0.0]


POINT_FEATURE_ENCODING:
    encoding_type: absolute_coordinates_encoding
    used_feature_list: ['x', 'y', 'z', 'intensity']
    src_feature_list: ['x', 'y', 'z', 'intensity']

DATA_PROCESSOR:
    - NAME: mask_points_and_boxes_outside_range
      REMOVE_OUTSIDE_BOXES: True
    - NAME: shuffle_points
      SHUFFLE_ENABLED:
        train: True
        test: False
    - NAME: transform_points_to_voxels
      VOXEL_SIZE: [0.05, 0.05, 0.1]
      MAX_POINTS_PER_VOXEL: 5
      MAX_NUMBER_OF_VOXELS:
        train: 16000
        test: 40000